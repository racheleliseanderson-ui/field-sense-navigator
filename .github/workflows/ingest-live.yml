name: Ingest live official readings

on:
  schedule:
    # Offset from the 10-minute critical job (:05/:15/:25/:35/:45/:55).
    - cron: "2,32 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Ingest mode"
        type: choice
        options:
          - all
          - critical
        default: all

concurrency:
  group: live-snapshot
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fast:
    name: Fast agencies (skip USBR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull USGS, NOAA CO-OPS, WSC, USACE, CDEC, NWS
        run: |
          if [ "${{ github.event.inputs.mode }}" = "critical" ]; then
            node scripts/ingest-live.mjs --mode=critical --skip-slow --merge
          else
            node scripts/ingest-live.mjs --skip-slow --merge
          fi
      - name: Publish snapshot + status (keep history)
        env:
          PUBLISH_MESSAGE: "ingest: fast agencies ${{ github.run_id }}"
        run: bash scripts/publish-live-snapshot.sh snapshot status
      - name: Notify on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-ingest.mjs --failed

  slow:
    name: Slow agencies (USBR, isolated)
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'critical' }}
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull USBR RISE / Hydromet sequentially
        run: node scripts/ingest-live.mjs --only-slow --merge
      - name: Merge USBR into live-snapshot
        env:
          PUBLISH_MESSAGE: "ingest: usbr ${{ github.run_id }}"
        run: bash scripts/publish-live-snapshot.sh snapshot status
      - name: Notify if USBR failed or hard-errored
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-ingest.mjs ${{ job.status == 'failure' && '--failed' || '' }}
