name: Resolve station bindings

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/data/destinations.json"
      - "src/data/destinations/**"
      - "src/data/location-overrides.json"
      - "src/data/station-overrides.json"
      - "scripts/resolve-locations.mjs"
      - "scripts/resolve-stations.mjs"
      - "scripts/assemble-resolver-catalog.mjs"
      - "scripts/preserve-resolver-bindings.mjs"
      - ".github/workflows/resolve-stations.yml"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Save prior verified bindings for outage protection
        run: cp src/data/station-bindings.json .resolver-station-bindings-prior.json
      - name: Assemble base + jurisdiction-shard catalog
        run: node scripts/assemble-resolver-catalog.mjs
      - name: Locate every water by published name
        run: node scripts/resolve-locations.mjs --retry-misses
      - name: Resolve USGS / NOAA / WSC bindings and NWS stations
        run: node scripts/resolve-stations.mjs
      - name: Preserve prior exact bindings across transient index outages
        run: node scripts/preserve-resolver-bindings.mjs
      - name: Restore sharded catalog source
        if: always()
        run: |
          node scripts/assemble-resolver-catalog.mjs --restore
          rm -f .resolver-station-bindings-prior.json
      - name: Publish refreshed data branch
        run: |
          if git diff --quiet -- src/data/locations.json src/data/station-bindings.json; then
            echo "No location or binding changes to publish."
            exit 0
          fi
          git config user.name "Rachel Elise Anderson"
          git config user.email "Rachel.Elise.Anderson@gmail.com"
          git add src/data/locations.json src/data/station-bindings.json
          git commit -m "data: refresh locations and station bindings from official indexes"
          git push --force origin HEAD:data/station-bindings
          echo "Published refreshed resolver data to data/station-bindings for review."
