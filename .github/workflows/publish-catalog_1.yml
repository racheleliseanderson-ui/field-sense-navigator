name: Publish catalog replica

# git is the source of truth for the catalog. This workflow GENERATES the
# Postgres read replica from the repository after a merge; it never reads back
# from Postgres and never writes to src/data. If the replica and the repository
# disagree, the repository is right and the replica is stale.

on:
  push:
    branches:
      - main
    paths:
      - "src/data/**"
      # The derived columns are produced by the app's own engine, so a change
      # to any of these changes the replica even when no record changed.
      - "src/lib/catalog.ts"
      - "src/lib/intelligence.ts"
      - "src/lib/access.ts"
      - "src/lib/water-reading.ts"
      - "scripts/publish-catalog.ts"
      - ".github/workflows/publish-catalog.yml"
  workflow_dispatch:

concurrency:
  group: publish-catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Derives every row and applies the same >=500 record floor the build
      # asserts, so a broken catalog never reaches the replica.
      - name: Derive and check
        run: bun run scripts/publish-catalog.ts --dry-run

      - name: Publish to the replica
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::notice::Replica secrets are not set — publish skipped. The application reads the bundled catalog, so nothing is broken by this."
            exit 0
          fi
          bun run scripts/publish-catalog.ts
