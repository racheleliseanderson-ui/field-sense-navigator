name: Scan agency-page closure language

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: live-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan official source URLs
        run: node scripts/scan-closures.mjs
      - name: Publish closures.json without wiping snapshot history
        env:
          PUBLISH_MESSAGE: "scan: agency-page closure language ${{ github.run_id }}"
        run: bash scripts/publish-live-snapshot.sh closures
